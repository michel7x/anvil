[project]
name = "anvil"
version = "0.1.0"
description = "Forge context-engineering scaffolds for AI coding agents (Claude Code, GitHub Copilot)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
keywords = ["context-engineering", "ai-agents", "claude-code", "github-copilot", "agents-md", "scaffold", "cli"]
dependencies = [
    "typer>=0.27.3",
]

[project.scripts]
anvil = "anvil.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.9.0"
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "anvil"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
