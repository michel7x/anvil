name: CI

# Stages run in order: static analysis -> build -> test -> publish.
# A stage is a group of parallel jobs. Each job runs one task with one tool.
# Every job of a stage `needs` every job of the previous stage.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholders: replace once the registries exist.
  PYTHON_REGISTRY_URL: https://upload.registry.example.com/legacy/
  CONTAINER_IMAGE: registry.example.com/anvil

jobs:
  # ---------------------------------------------------------------------------
  # Artifact tag, shared by every stage:
  #   pull_request:   pr-<pr-number>-<short-sha>  (sha of the PR head commit)
  #   push to main:   main-<short-sha>
  # ---------------------------------------------------------------------------
  metadata:
    name: meta / tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.version }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_PR_HEAD_SHA: true
        with:
          tags: |
            type=sha,prefix=pr-${{ github.event.pull_request.number }}-,enable=${{ github.event_name == 'pull_request' }}
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}

  # ---------------------------------------------------------------------------
  # Stage 1: static analysis
  # ---------------------------------------------------------------------------
  ruff-lint:
    name: static / ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4
        with:
          args: check --output-format=github

  ruff-format:
    name: static / ruff format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4
        with:
          args: format --check --output-format=github

  mypy:
    name: static / mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy

  hadolint:
    name: static / hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3
        with:
          dockerfile: containers/anvil.containerfile

  # ---------------------------------------------------------------------------
  # Stage 2: build
  # ---------------------------------------------------------------------------
  build-python:
    name: build / uv build
    needs: [metadata, ruff-lint, ruff-format, mypy, hadolint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ needs.metadata.outputs.tag }}
          path: dist/
          if-no-files-found: error

  build-container:
    name: build / docker buildx
    needs: [metadata, ruff-lint, ruff-format, mypy, hadolint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build only: nothing is pushed. The image is exported as a local tar for
      # the smoke test, and the layers go to the GitHub Actions cache so the
      # publish stage reuses them instead of rebuilding.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/anvil.containerfile
          push: false
          tags: anvil:${{ needs.metadata.outputs.tag }}
          labels: ${{ needs.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=${{ runner.temp }}/anvil-image.tar
      - uses: actions/upload-artifact@v7
        with:
          name: anvil-image-${{ needs.metadata.outputs.tag }}
          path: ${{ runner.temp }}/anvil-image.tar
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Stage 3: test
  # ---------------------------------------------------------------------------
  pytest:
    name: test / pytest
    needs: [build-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest --cov=anvil --cov-report=term-missing

  container-smoke:
    name: test / container smoke
    needs: [metadata, build-container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: anvil-image-${{ needs.metadata.outputs.tag }}
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/anvil-image.tar"
      - run: docker run --rm "anvil:$TAG" --help
        env:
          TAG: ${{ needs.metadata.outputs.tag }}

  # ---------------------------------------------------------------------------
  # Stage 4: publish (placeholders; nothing is pushed yet)
  # ---------------------------------------------------------------------------
  # TODO: replace the echo with `uv publish` once the Python registry exists.
  publish-python:
    name: publish / uv publish (placeholder)
    needs: [metadata, pytest, container-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.metadata.outputs.tag }}
          path: dist/
      - run: echo "uv publish --publish-url $PYTHON_REGISTRY_URL dist/*"

  # TODO: once the container registry exists, enable docker/login-action, set
  # CONTAINER_IMAGE to the real image, and set `push: true`. Nothing else changes.
  publish-container:
    name: publish / docker push (placeholder)
    needs: [metadata, pytest, container-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # - uses: docker/login-action@v4
      #   with:
      #     registry: registry.example.com
      #     username: ${{ secrets.REGISTRY_USERNAME }}
      #     password: ${{ secrets.REGISTRY_PASSWORD }}
      # Same context, file and cache as build-container: every layer is a cache
      # hit, so the image from the build stage is reused, not rebuilt.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/anvil.containerfile
          push: false
          tags: ${{ env.CONTAINER_IMAGE }}:${{ needs.metadata.outputs.tag }}
          labels: ${{ needs.metadata.outputs.labels }}
          cache-from: type=gha
      - run: echo "would push $CONTAINER_IMAGE:$TAG"
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
